<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OLIVE SONG</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="home.css" />
  </head>

  <body>
    <div class="util">
      <div class="container">
        <a>로그인</a>
        <a>회원가입</a>
        <a>장바구니 <em>(3)</em></a>
        <a>고객센터</a>
      </div>
    </div>

    <div class="header">
      <div class="container">
        <div class="logo">
          <img src="Image_logo.png" alt="LOGO Text" />
          <img src="Text_logo.png" alt="LOGO Text" />
        </div>
        <div class="search">상품, 브랜드, 성분 검색</div>
        <div class="hright">최근 본 상품 &#9662;</div>
      </div>
    </div>

    <nav class="gnb">
      <div class="container">
        <a class="cat">&#9776; 카테고리</a>
        <a>오특</a>
        <a href="ranking.html">랭킹</a>
        <a href="personalcolor.html">퍼스널컬러</a>
        <a href="tutorial.html" class="on">튜토리얼</a>
        <a>테마관</a>
        <a>기획전</a>
        <a>세일</a>
        <a>기프트카드</a>
        <a>멤버십/쿠폰</a>
        <a>이벤트</a>
      </div>
    </nav>

    <!-- 상품 카드에서 사용하는 장바구니 아이콘 -->
    <svg class="home-icon-definitions" aria-hidden="true" focusable="false">
      <symbol id="home-cart-icon" viewBox="0 0 24 24">
        <path d="M3 4h2l2.4 11h11L21 8H6.2"></path>
        <circle cx="9" cy="19.5" r="1.3"></circle>
        <circle cx="17" cy="19.5" r="1.3"></circle>
      </symbol>
    </svg>

    <main id="home-main" class="home-inner home-main">
      <!-- 메인 배너: 글자가 없는 사진으로 교체 -->
      <section class="home-hero" aria-label="추천 상품 배너">
        <!-- 배너 선택 상태: 방향키로도 선택 가능 -->
        <input
          class="home-banner-radio"
          type="radio"
          name="home-banner"
          id="home-banner-1"
          aria-label="배너 1"
          checked
        />
        <input
          class="home-banner-radio"
          type="radio"
          name="home-banner"
          id="home-banner-2"
          aria-label="배너 2"
        />
        <input
          class="home-banner-radio"
          type="radio"
          name="home-banner"
          id="home-banner-3"
          aria-label="배너 3"
        />

        <!-- 배너 사진: 아래 세 경로를 실제 사진으로 교체 -->
        <div class="home-banner-images">
          <img
            class="home-hero-image home-banner-image-1"
            src="banner-image/banner1.jpg"
            alt=""
          />
          <img
            class="home-hero-image home-banner-image-2"
            src="banner-image/banner2.jpg"
            alt=""
          />
          <img
            class="home-hero-image home-banner-image-3"
            src="banner-image/banner3.jpg"
            alt=""
          />
        </div>

        <!-- 배너 전환 컨트롤 -->
        <div class="home-banner-controls" role="group" aria-label="배너 전환">
          <!-- 첫 번째 배너를 보고 있을 때 -->
          <div class="home-banner-control home-banner-control-1">
            <label
              class="home-banner-arrow home-banner-prev"
              for="home-banner-3"
              title="이전 배너"
            >
              <span class="home-sr-only">이전 배너</span>
            </label>

            <span class="home-banner-number">1/3</span>

            <label
              class="home-banner-arrow home-banner-next"
              for="home-banner-2"
              title="다음 배너"
            >
              <span class="home-sr-only">다음 배너</span>
            </label>
          </div>

          <!-- 두 번째 배너를 보고 있을 때 -->
          <div class="home-banner-control home-banner-control-2">
            <label
              class="home-banner-arrow home-banner-prev"
              for="home-banner-1"
              title="이전 배너"
            >
              <span class="home-sr-only">이전 배너</span>
            </label>

            <span class="home-banner-number">2/3</span>

            <label
              class="home-banner-arrow home-banner-next"
              for="home-banner-3"
              title="다음 배너"
            >
              <span class="home-sr-only">다음 배너</span>
            </label>
          </div>

          <!-- 세 번째 배너를 보고 있을 때 -->
          <div class="home-banner-control home-banner-control-3">
            <label
              class="home-banner-arrow home-banner-prev"
              for="home-banner-2"
              title="이전 배너"
            >
              <span class="home-sr-only">이전 배너</span>
            </label>

            <span class="home-banner-number">3/3</span>

            <label
              class="home-banner-arrow home-banner-next"
              for="home-banner-1"
              title="다음 배너"
            >
              <span class="home-sr-only">다음 배너</span>
            </label>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
