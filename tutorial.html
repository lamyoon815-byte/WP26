<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>튜토리얼 | OLIVE SONG</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="tutorial.css" />
  </head>

  <body>
    <div class="util">
      <div class="container">
        <a>로그인</a>
        <a>회원가입</a>
        <a>장바구니 <em>(3)</em></a>
        <a>고객센터</a>
      </div>
    </div>

    <div class="header">
      <div class="container">
        <div class="logo">
          <img src="Image_logo.png" alt="LOGO Text" />
          <img src="Text_logo.png" alt="LOGO Text" />
        </div>
        <div class="search">상품, 브랜드, 성분 검색</div>
        <div class="hright">최근 본 상품 &#9662;</div>
      </div>
    </div>

    <nav class="gnb">
      <div class="container">
        <a class="cat" data-soon>&#9776; 카테고리</a>
        <a data-soon>오특</a>
        <a href="ranking.html">랭킹</a>
        <a href="personalcolor.html">퍼스널컬러</a>
        <a href="tutorial.html" class="on">튜토리얼</a>
        <a data-soon>테마관</a>
        <a data-soon>기획전</a>
        <a data-soon>세일</a>
        <a data-soon>기프트카드</a>
        <a data-soon>멤버십/쿠폰</a>
        <a data-soon>이벤트</a>
      </div>
    </nav>

    <div id="toast">준비 중인 메뉴예요</div>
    <div class="title-best">
      <h1>
        튜토리얼
        <span>내게 있는 화장품으로 새로운 메이크업 스타일을 도전해보세요.</span>
      </h1>
    </div>
    <main class="container tutorial-page">
      <!--
    화장품 카테고리 radio buttons으로 선택하기
    아래 label의 for와 input의 id를 연결
    -->
      <input class="choice" type="radio" name="category" id="category-base" />
      <input class="choice" type="radio" name="category" id="category-eye" />
      <input class="choice" type="radio" name="category" id="category-lip" />
      <input class="choice" type="radio" name="category" id="category-cheek" />
      <input
        class="choice"
        type="radio"
        name="category"
        id="category-contour"
      />

      <!-- 이미지 카테고리 -->
      <div class="category-area">
        <div class="category-wrap">
          <div class="category-list">
            <div class="category-item">
              <label class="category-label" for="category-base">
                <div class="category-content">
                  <div class="category-image">
                    <img src="category-base.png" alt="베이스" />
                  </div>
                  <span class="category-name">베이스</span>
                </div>
              </label>
            </div>

            <div class="category-item">
              <label class="category-label" for="category-eye">
                <div class="category-content">
                  <div class="category-image">
                    <img src="category-eye.png" alt="아이" />
                  </div>
                  <span class="category-name">아이</span>
                </div>
              </label>
            </div>

            <div class="category-item">
              <label class="category-label" for="category-lip">
                <div class="category-content">
                  <div class="category-image">
                    <img src="category-lip.png" alt="립" />
                  </div>
                  <span class="category-name">립</span>
                </div>
              </label>
            </div>

            <div class="category-item">
              <label class="category-label" for="category-cheek">
                <div class="category-content">
                  <div class="category-image">
                    <img src="category-cheek.png" alt="치크" />
                  </div>
                  <span class="category-name">치크</span>
                </div>
              </label>
            </div>

            <div class="category-item">
              <label class="category-label" for="category-contour">
                <div class="category-content">
                  <div class="category-image">
                    <img src="category-contour.png" alt="쉐딩 · 하이라이터" />
                  </div>
                  <span class="category-name">쉐딩 · 하이라이터</span>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 메이크업 튜토리얼 제목 -->
      <div class="tutorial-heading">
        <h3>메이크업 튜토리얼</h3>
      </div>

      <div class="initial-guide">
        <strong>오늘은 어떤 메이크업을 해볼까요?</strong>
        <p>
          위에서 내가 갖고 있는 화장품을 선택하면 관련 튜토리얼을 볼 수 있어요.
        </p>
      </div>

      <!-- 베이스 구매 상품 -->
      <div class="category-panel panel-base">
        <input
          class="choice product-choice"
          type="radio"
          name="base-product"
          id="base-1"
        />
        <input
          class="choice product-choice"
          type="radio"
          name="base-product"
          id="base-2"
        />

        <!-- 베이스 구매 상품 리스트 -->
        <div class="product-list">
          <label class="product-label" for="base-1">
            <span class="product-image">
              <img src="product-clio-cushion.png" alt="클리오 킬커버 쿠션" />
            </span>
            <span class="product-copy">
              <span class="product-brand">클리오</span>
              <strong class="product-name">킬커버 쿠션</strong>
            </span>
          </label>

          <label class="product-label" for="base-2">
            <span class="product-image">
              <img
                src="product-JungSaemMool-cushion.png"
                alt="정샘물 에센셜 쿠션"
              />
            </span>
            <span class="product-copy">
              <span class="product-brand">정샘물</span>
              <strong class="product-name">에센셜 쿠션</strong>
            </span>
          </label>
        </div>

        <div class="select-guide">
          <strong>오늘은 어떤 베이스 메이크업을 해볼까요?</strong>
          <p>
            위에서 구매한 베이스 제품을 선택하면 관련 튜토리얼을 볼 수 있어요.
          </p>
        </div>

        <div class="product-result result-base-1">
          <!-- 튜토리얼 영상 정렬 바  -->
          <div class="video-toolbar">
            <p class="video-total">총 <strong>12</strong>개</p>

            <div class="video-toolbar-options">
              <div class="video-sort" role="group" aria-label="영상 정렬">
                <label class="video-sort-option">
                  <input
                    type="radio"
                    name="sort-base-1"
                    value="recommend"
                    checked
                  />
                  <span>추천순</span>
                </label>

                <label class="video-sort-option">
                  <input type="radio" name="sort-base-1" value="latest" />
                  <span>최신순</span>
                </label>

                <label class="video-sort-option">
                  <input type="radio" name="sort-base-1" value="views" />
                  <span>조회순</span>
                </label>
              </div>

              <select class="video-page-size" aria-label="표시할 영상 개수">
                <option value="12">12개씩</option>
                <option value="24">24개씩</option>
                <option value="36">36개씩</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer></footer>
    <script>
      document.querySelectorAll("[data-soon], .gnb a[href]").forEach((el) =>
        el.addEventListener("click", (e) => {
          e.preventDefault();
          const t = document.getElementById("toast");
          t.textContent = el.hasAttribute("data-soon")
            ? "준비 중인 메뉴예요"
            : "(테스트 화면이라 이동하지 않아요) → " + el.getAttribute("href");
          t.classList.add("show");
          setTimeout(() => t.classList.remove("show"), 1500);
        }),
      );
    </script>
  </body>
</html>
