<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>튜토리얼 | OLIVE SONG</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .title-best {
        width: 100%;
        height: 100%;
        margin: 2rem 0;
      }

      .title-best h1 {
        width: 1200px;
        margin: 0 auto;
        color: #000;
        font-size: 40px;
        line-height: 40px;
        position: relative;
      }

      .title-best h1 span {
        display: inline-block;
        margin-left: 15px;
        color: #333;
        font-size: 18px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div class="util">
      <div class="container">
        <a>로그인</a><a>회원가입</a><a>장바구니 <em>(3)</em></a
        ><a>고객센터</a>
      </div>
    </div>
    <div class="header">
      <div class="container">
        <div class="logo">
          <img src="Image_logo.png" alt="LOGO Text" />
          <img src="Text_logo.png" alt="LOGO Text" />
        </div>
        <div class="search">상품, 브랜드, 성분 검색</div>
        <div class="hright">최근 본 상품 &#9662;</div>
      </div>
    </div>
    <nav class="gnb">
      <div class="container">
        <a class="cat" data-soon>&#9776; 카테고리</a>
        <a data-soon>오특</a>
        <a href="ranking.html">랭킹</a>
        <a href="personalcolor.html">퍼스널컬러</a>
        <a href="tutorial.html" class="on">튜토리얼</a>
        <a data-soon>테마관</a>
        <a data-soon>기획전</a>
        <a data-soon>세일</a>
        <a data-soon>기프트카드</a>
        <a data-soon>멤버십/쿠폰</a>
        <a data-soon>이벤트</a>
      </div>
    </nav>
    <div id="toast">준비 중인 메뉴예요</div>
    <div class="title-best">
      <h1>
        튜토리얼
        <span>내게 있는 화장품으로 새로운 메이크업 스타일을 만들어보세요.</span>
      </h1>
    </div>
    <footer></footer>
    <script>
      document.querySelectorAll("[data-soon], .gnb a[href]").forEach((el) =>
        el.addEventListener("click", (e) => {
          e.preventDefault();
          const t = document.getElementById("toast");
          t.textContent = el.hasAttribute("data-soon")
            ? "준비 중인 메뉴예요"
            : "(테스트 화면이라 이동하지 않아요) → " + el.getAttribute("href");
          t.classList.add("show");
          setTimeout(() => t.classList.remove("show"), 1500);
        }),
      );
    </script>
  </body>
</html>
